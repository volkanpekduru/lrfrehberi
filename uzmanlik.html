<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Sitemiz Yapım Aşamasında</title>
    <style>
        /* Lüks Cam Göbeği & Altın Temalı CSS Tasarımı */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cinzel', 'Didot', 'Segoe UI', sans-serif;
            letter-spacing: 0.5px;
        }

        body {
            /* Lüks ve derinlik hissi veren zengin cam göbeği (cyan) arka plan geçişi */
            background: radial-gradient(circle at center, #005b66 0%, #002d33 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            /* Premium buzlu cam etkisi (Glassmorphism) */
            background: rgba(0, 20, 23, 0.4);
            padding: 60px 45px;
            border-radius: 30px;
            /* Altın varak hissi veren çok ince, zarif kenarlık */
            border: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(20px);
            /* Derinlik katan lüks gölge efekti */
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 
                        inset 0 0 30px rgba(212, 175, 55, 0.05);
        }

        .luxury-badge {
            /* İpek şerit hissi veren altın detaylı rozet */
            border: 1px solid #d4af37;
            color: #d4af37;
            background: rgba(212, 175, 55, 0.05);
            padding: 6px 20px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: inline-block;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 300;
            line-height: 1.3;
            margin-bottom: 20px;
            /* Saf beyazdan hafif platin rengine zarif geçiş */
            background: linear-gradient(to bottom, #ffffff 0%, #e0f2f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .divider {
            width: 60px;
            height: 1px;
            background: linear-gradient(to right, transparent, #d4af37, transparent);
            margin: 0 auto 25px auto;
        }

        p {
            color: #b2dfdb;
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .notify-form {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .notify-form input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 16px 24px;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            width: 65%;
            outline: none;
            transition: all 0.4s ease;
        }

        .notify-form input:focus {
            border-color: #d4af37;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
        }

        /* Lüks Altın (Gold) Buton Tasarımı */
        .notify-form button {
            background: linear-gradient(135deg, #d4af37 0%, #aa8210 100%);
            color: #002d33;
            border: none;
            padding: 16px 32px;
            border-radius: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 4px 15px rgba(170, 130, 16, 0.3);
        }

        .notify-form button:hover {
            background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Lüks Rozet -->
        <div>
            <span class="luxury-badge">Yakında Hizmetinizde</span>
        </div>

        <!-- Başlık ve İnce Ayırıcı Çizgi -->
        <h1>Seçkin Deneyim<br>Çok Yakında</h1>
        <div class="divider"></div>
        
        <!-- Açıklama Metni -->
        <p>Ayrıcalıklı ve kusursuz yeni dijital platformumuzu sizler için inşa ediyoruz. Bu özel açılış için yerinizi şimdiden ayırtın.</p>

        <!-- Premium Form Alanı -->
        <form class="notify-form" onsubmit="event.preventDefault(); alert('Ayrıcalıklı listemize kaydınız başarıyla tamamlandı.');">
            <input type="email" placeholder="E-posta adresinizi giriniz" required>
            <button type="submit">Davetiye İste</button>
        </form>
    </div>

</body>
</html>
